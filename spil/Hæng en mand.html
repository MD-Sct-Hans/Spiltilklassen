<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132c42"><title>Hæng en mand</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2e5e74,#132b44 72%);color:#17314b;font-family:system-ui,'Segoe UI',sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #f5ab35;outline-offset:3px}.wrap{max-width:1200px;margin:auto;padding:16px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;color:#fff;margin:4px 0 17px;flex-wrap:wrap}.top a{color:#fff;font-weight:700;text-decoration:none}.top h1{margin:0;font-size:clamp(25px,4vw,39px)}.board{background:#fff9e9;border:7px solid #b67f44;border-radius:23px;padding:clamp(12px,2.5vw,25px);box-shadow:0 13px 0 #0b1c2d;display:grid;grid-template-columns:minmax(270px,1fr) minmax(0,1.45fr);gap:24px}.left{border-radius:17px;background:#e4f0e9;padding:18px;display:flex;flex-direction:column;gap:12px}.hang{width:100%;max-height:370px;aspect-ratio:1.15;display:block}.hang line,.hang path,.hang circle{stroke:#263c4b;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.hang .wood{stroke:#80512b;stroke-width:11}.part{opacity:0;transition:opacity .18s}.part.on{opacity:1}.statusbox{padding:12px;text-align:center;background:#fff;border-radius:12px;font-size:16px;font-weight:750}.wrong{font-size:28px;font-weight:900;color:#c45136}.right{display:flex;flex-direction:column;gap:16px}.settings{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.settings select{border:2px solid #d9d3bc;border-radius:10px;padding:10px 12px;background:#fff;color:#203747}.settings label{font-weight:800}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:850;background:#e8a44b;color:#172c3e}.btn.secondary{background:#e5e9e8}.topic{font-size:14px;font-weight:800;color:#52716c;text-transform:uppercase;letter-spacing:1.5px}.word{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;min-height:88px}.letter{display:grid;place-items:center;width:clamp(28px,5vw,52px);height:61px;border-bottom:5px solid #14354b;font-size:clamp(23px,3.7vw,39px);font-weight:900}.letter.miss{color:#be472f}.keyboard{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:7px}.key{background:#fff;border:2px solid #aebdc0;border-radius:10px;min-height:48px;font-weight:850;color:#163348;font-size:18px}.key.correct{background:#c8edd7;border-color:#4a9c70}.key.wrong{background:#f5d2c9;border-color:#ca826b}.key:disabled{cursor:default}.message{min-height:63px;padding:13px 16px;background:#fff;border:2px dashed #d1b882;border-radius:13px;font-weight:750;line-height:1.5}.small{font-size:13px;color:#60736c}.footer{color:#e5f2ed;text-align:center;margin:16px 0;font-size:13px}.confetti{font-size:31px;text-align:center}.hide{display:none}@media(max-width:740px){.board{grid-template-columns:1fr}.hang{max-height:240px}.left{padding:9px}.keyboard{grid-template-columns:repeat(7,minmax(0,1fr))}.key{min-height:43px}.letter{height:46px}.wrap{padding:8px}.right{gap:12px}}
</style></head><body><main class="wrap"><header class="top"><a href="../index.html">← Tilbage til KlasseSpil</a><h1>🎯 Hæng en mand</h1><button class="btn secondary" id="fullscreen">⛶ Fuld skærm</button></header><div class="board"><section class="left"><svg class="hang" viewBox="0 0 340 340" role="img" aria-label="Galgen tegnes ved forkerte gæt"><path class="wood" d="M38 311 H212 M95 310 V25 H225 V70"/><circle class="part" data-step="1" cx="225" cy="99" r="29"/><path class="part" data-step="2" d="M225 129 V222"/><path class="part" data-step="3" d="M225 154 L169 192"/><path class="part" data-step="4" d="M225 154 L281 192"/><path class="part" data-step="5" d="M225 222 L179 280"/><path class="part" data-step="6" d="M225 222 L271 280"/><path class="part" data-step="7" d="M211 94 h2 M237 94 h2"/><path class="part" data-step="8" d="M213 115 Q225 101 237 115"/></svg><div class="statusbox">Forkerte gæt: <span class="wrong" id="errors">0 / 8</span><div class="small">I har 8 forsøg til at gætte ordet</div></div></section><section class="right"><div class="settings"><label for="level">Sværhedsgrad:</label><select id="level"><option value="let">Let</option><option value="mellem" selected>Mellem</option><option value="svaer">Svær</option></select><button class="btn" id="new">🎲 Nyt tilfældigt ord</button></div><div class="topic" id="topic">Kategori: Dyr</div><div class="word" id="word" aria-label="Ordet, der skal gættes"></div><div class="message" id="message" role="status">Vælg et bogstav for at starte. Hele klassen må gætte med!</div><div class="keyboard" id="keyboard"></div><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><button class="btn secondary" id="hint">💡 Vis et hint</button><button class="btn secondary" id="reveal">Vis ordet</button><span class="small" id="counter"></span></div><div class="confetti hide" id="confetti">🎉 🏆 🎉</div></section></div><p class="footer">Et gratis undervisningsspil fra KlasseSpil. Ordene vælges tilfældigt, og alle spørgsmål virker uden internet.</p></main><script>
(()=>{'use strict';const words={let:[['KAT','Dyr','Et dyr, som ofte spinder.'],['HUND','Dyr','Et dyr, der kan gø.'],['MUS','Dyr','Et meget lille pattedyr.'],['BÅD','Transport','Kan sejle på vandet.'],['BIL','Transport','Har normalt fire hjul.'],['IS','Mad','En kold dessert.'],['FISK','Dyr','Lever i vand.'],['SOL','Natur','Giver Jorden lys.'],['REGN','Vejr','Vand, der falder fra skyer.'],['BORD','Ting','Man kan spise ved det.'],['SKO','Tøj','Man har dem på fødderne.'],['TRÆ','Natur','Har stamme og grene.'],['BARN','Mennesker','En person, der endnu ikke er voksen.'],['ÆBLE','Mad','En frugt, der kan være rød eller grøn.'],['PÆRE','Mad','En frugt med typisk smal top.'],['HUS','Bygning','Man kan bo i det.'],['KAGE','Mad','Spises ofte til fødselsdag.'],['SKOLE','Steder','Her er der undervisning.'],['BOG','Ting','Den har sider og kan læses.'],['HÅND','Krop','Har typisk fem fingre.']],mellem:[['BLÆKSPRUTTE','Dyr','Har otte arme.'],['KROKODILLE','Dyr','Et stort krybdyr med kraftige kæber.'],['PAPEGØJE','Dyr','En fugl, som kan efterligne lyde.'],['RUMSKIB','Rummet','Et fartøj, som kan rejse uden for Jorden.'],['KOORDINAT','Matematik','Fortæller, hvor et punkt ligger.'],['SKATTEKISTE','Pirater','Opbevarer guld og andre skatte.'],['SKILDPADDE','Dyr','Et krybdyr med skjold.'],['VULKAN','Natur','Kan sende lava og aske ud.'],['REGNBUE','Vejr','Kan ses når lys brydes i vanddråber.'],['JORDSKÆLV','Natur','Når jorden ryster.'],['KÆNGURU','Dyr','Et hoppende pungdyr.'],['TERMOMETER','Naturfag','Måler temperatur.'],['KAMÆLEON','Dyr','Et krybdyr, som kan skifte farve.'],['SOMMERFUGL','Dyr','Et insekt med farverige vinger.'],['TANDLÆGE','Job','Hjælper med at holde tænderne sunde.'],['LYNKILDE','Natur','Det modsatte af mørke er et spor.'],['HOVEDPINE','Krop','Når man har ondt i hovedet.'],['VANDMELON','Mad','En meget saftig og ofte stor frugt.'],['DINOSAUR','Fortid','Levede længe før mennesker.'],['BALLON','Ting','Kan fyldes med luft eller helium.']],svaer:[['TYNGDEKRAFT','Naturfag','Holder os nede på Jorden.'],['FOTOSYNTESE','Naturfag','Planter bruger lys til at danne sukker.'],['VANDREFALK','Dyr','En rovfugl, der kan styrtdykke meget hurtigt.'],['STJERNEBILLEDE','Rummet','Et mønster af stjerner set fra Jorden.'],['METAMORFOSE','Naturfag','En stor forvandling i et dyrs livscyklus.'],['MIKROSKOP','Naturfag','Bruges til at se meget små ting.'],['HJERNEVINDING','Krop','En fold på hjernens overflade.'],['KONTINENT','Geografi','En af Jordens store landmasser.'],['FORSKNING','Viden','Systematisk arbejde for at få ny viden.'],['EKSPERIMENT','Naturfag','Et forsøg, der undersøger noget.'],['KLIMAFORANDRING','Natur','En ændring i klimaet over længere tid.'],['SOLFORMØRKELSE','Rummet','Månen dækker Solen set fra Jorden.'],['FJERDRAGT','Dyr','Alle fjerene på en fugl.'],['INSTRUMENT','Musik','Bruges til at spille musik.'],['ELEKTRICITET','Naturfag','Får mange apparater til at virke.'],['ARKÆOLOG','Historie','Undersøger spor fra fortidens mennesker.'],['KAMOUFLAGE','Natur','At falde i ét med omgivelserne.'],['HJERTESLAG','Krop','Kan mærkes som puls.'],['MAGNETISME','Naturfag','Kan få bestemte metaller til at blive tiltrukket.'],['VANDKREDSLØB','Naturfag','Vandets vej mellem hav, skyer og jord.']]};
const alphabet=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZÆØÅ'];const $=id=>document.getElementById(id);let answer='',category='',clue='',guessed=new Set(),mistakes=0,finished=false,previous={};const choose=()=>{const level=$('level').value, pool=words[level];let options=pool.filter(w=>w[0]!==previous[level]);if(!options.length) options=pool;const w=options[Math.floor(Math.random()*options.length)];previous[level]=w[0];[answer,category,clue]=w;guessed=new Set();mistakes=0;finished=false;$('topic').textContent='Kategori: '+category;$('message').textContent='Vælg et bogstav for at starte. Hele klassen må gætte med!';$('confetti').classList.add('hide');update()};function update(){const won=[...answer].every(c=>!alphabet.includes(c)||guessed.has(c));if(won&&!finished){finished=true;$('message').textContent='Flot! I gættede ordet: '+answer+'!';$('confetti').classList.remove('hide')}else if(mistakes>=8&&!finished){finished=true;$('message').textContent='Øv! Ordet var '+answer+'. Prøv et nyt ord.'} $('errors').textContent=mistakes+' / 8';$('counter').textContent='Gættede bogstaver: '+guessed.size;$('word').innerHTML='';for(const c of answer){const d=document.createElement('span');d.className='letter';d.textContent=guessed.has(c)||finished?c:'';if(finished&&!guessed.has(c))d.classList.add('miss');$('word').appendChild(d)} $('keyboard').innerHTML='';for(const c of alphabet){const btn=document.createElement('button');btn.className='key'+(guessed.has(c)?(answer.includes(c)?' correct':' wrong'):'');btn.textContent=c;btn.disabled=guessed.has(c)||finished;btn.setAttribute('aria-label','Gæt bogstavet '+c);btn.addEventListener('click',()=>guess(c));$('keyboard').appendChild(btn)} document.querySelectorAll('.part').forEach(p=>p.classList.toggle('on',Number(p.dataset.step)<=mistakes))}function guess(c){if(finished||guessed.has(c))return;guessed.add(c);if(!answer.includes(c)){mistakes++;$('message').textContent='Desværre, '+c+' er ikke med. Prøv et andet bogstav.'}else{$('message').textContent='Godt gættet! '+c+' er med i ordet.'}update()}$('new').onclick=choose;$('level').onchange=choose;$('hint').onclick=()=>{$('message').textContent='💡 Hint: '+clue};$('reveal').onclick=()=>{if(finished)return;finished=true;$('message').textContent='Ordet var '+answer+'. Vælg et nyt ord for at spille igen.';update()};$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey||/input|select|textarea/i.test(e.target.tagName))return;const c=e.key.toLocaleUpperCase('da');if(alphabet.includes(c))guess(c)});choose();})();
</script></body></html>
