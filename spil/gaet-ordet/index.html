.picture img{display:block;width:100%;height:100%;max-width:480px;object-fit:contain;border-radius:12px} .picture{font-size:12px}.word.long{font-size:clamp(20px,3vw,38px)}</style></head><body><div class="app"><header><div class="logo">SpilTilKlassen<span class="sub" id="subtitle">Gæt ordet · Billedord til undervisningen</span></div><div class="hdrctrl"><div class="lang"><button aria-pressed="true" class="active" id="da">Dansk</button><button aria-pressed="false" id="en">English</button><button aria-pressed="false" id="de">Deutsch</button></div><button class="aux" id="helpBtn" type="button">ⓘ <span id="helpLabel">Hjælp</span></button><button class="aux" id="fullBtn" type="button">⛶</button></div></header><section class="settings"><label for="category" id="selectLabel">Kategori:</label><select id="category"></select><span class="count" id="count"></span></section><main aria-live="polite" class="stage"><div class="category" id="catLabel"></div><div class="picture" id="picture" role="img"></div><div class="word" id="word"></div></main><div class="actions"><button id="prev"></button><button class="next" id="next"></button><button id="shuffle"></button></div><div class="footer" id="footer"></div></div><div class="help" hidden="" id="help"><div aria-labelledby="hTitle" aria-modal="true" class="panel" role="dialog"><h2 id="hTitle"></h2><p id="hText"></p><p id="hTip"></p><button id="start"></button></div></div><script src="ordliste.js"></script><script>'use strict';
const WORDS=window.ORDLISTE||[];
const CATS=Array.from(new Set(WORDS.map(w=>w.cat))).map(k=>({key:k,da:k,en:({'Frugt og grønt':'Fruit & vegetables','Skole':'School','Hjemmet':'Home','Transport':'Transport','Vejr':'Weather','Dyr':'Animals','Tøj':'Clothes','Kroppen':'Body','Mad og drikke':'Food & drinks'})[k]||k,de:({'Frugt og grønt':'Obst und Gemüse','Skole':'Schule','Hjemmet':'Zuhause','Transport':'Verkehr','Vejr':'Wetter','Dyr':'Tiere','Tøj':'Kleidung','Kroppen':'Körper','Mad og drikke':'Essen und Trinken'})[k]||k}));
const $=id=>document.getElementById(id);
const tx={da:{subtitle:'Gæt ordet · Billeder fra mapper',help:'Hjælp',category:'Kategori:',all:'Alle kategorier',prev:'← Forrige',next:'Næste →',shuffle:'↻ Bland',start:'Start spillet',hTitle:'Sådan spiller I',hText:'Én elev sidder med ryggen til tavlen. Klassen beskriver billedet og ordet uden at sige ordet.',hTip:'Læg billeder i billeder/kategori/ord.png. Kun ord med billeder vises.',word:'Ord',of:'af',footer:'Billederne ligger i mapper · Dansk, engelsk og tysk',image:'Billede af',empty:'Der er endnu ingen billeder i denne kategori. Læg billedfiler i den tilsvarende mappe.'},en:{subtitle:'Guess the Word · Pictures from folders',help:'Help',category:'Category:',all:'All categories',prev:'← Previous',next:'Next →',shuffle:'↻ Shuffle',start:'Start playing',hTitle:'How to play',hText:'One student sits with their back to the board. The class describes the picture and word without saying the word.',hTip:'Put pictures in billeder/category/Danish-word.png. Only words with pictures are shown.',word:'Word',of:'of',footer:'Pictures are loaded from folders · Danish and English',image:'Picture of',empty:'No pictures in this category yet. Add image files to its folder.'},de:{subtitle:'Rate das Wort · Bilder aus Ordnern',help:'Hilfe',category:'Kategorie:',all:'Alle Kategorien',prev:'← Zurück',next:'Weiter →',shuffle:'↻ Mischen',start:'Spiel starten',hTitle:'So wird gespielt',hText:'Ein Kind sitzt mit dem Rücken zur Tafel. Die Klasse beschreibt das Bild und den Begriff, ohne das Wort selbst zu sagen.',hTip:'Bilder nach dem dänischen Wort benennen und im passenden Kategorieordner speichern. Nur Wörter mit Bild werden angezeigt.',word:'Wort',of:'von',footer:'Bilder aus Ordnern · Dänisch, Englisch und Deutsch',image:'Bild von',empty:'In dieser Kategorie sind noch keine Bilder vorhanden. Füge Bilder zum entsprechenden Ordner hinzu.'}};
let lang='da',cat='all',deck=[],history=[],index=-1,available=[];
function path(cat,word,ext){return 'billeder/'+encodeURIComponent(cat)+'/'+encodeURIComponent(word)+'.'+ext;}
function findImage(w){return new Promise(resolve=>{let extensions=['png','jpg','jpeg','webp','svg'];let n=0;function check(){if(n===extensions.length){resolve(null);return}let url=path(w.cat,w.da,extensions[n++]);let im=new Image();im.onload=()=>resolve(url);im.onerror=check;im.src=url;}check();});}
function reshuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return available.filter(w=>cat==='all'||cat===w.cat)}
function catName(key){return (CATS.find(c=>c.key===key)||{})[lang]||key}
function show(w){if(!w)return;let value=w[lang];$('word').textContent=value;$('word').classList.toggle('long',value.length>16);$('catLabel').textContent=catName(w.cat);let img=document.createElement('img');img.src=w.image;img.alt=(tx[lang].image+' '+value);$('picture').replaceChildren(img);$('count').textContent=tx[lang].word+' '+(index+1)+' '+tx[lang].of+' '+pool().length;$('prev').disabled=index<1;}
function emptyState(){let m=tx[lang].empty;$('word').textContent=m;$('word').classList.add('long');$('catLabel').textContent=cat==='all'?tx[lang].all:catName(cat);$('picture').textContent='';$('count').textContent='0';$('prev').disabled=true;}
function next(){if(index<history.length-1){index++;show(history[index]);return}if(!deck.length){deck=reshuffle(pool().slice());history=[];index=-1}if(!deck.length){emptyState();return}history.push(deck.pop());index=history.length-1;show(history[index])}
function previous(){if(index>0){index--;show(history[index])}}
function reset(){deck=reshuffle(pool().slice());history=[];index=-1;next()}
function setLanguage(value){lang=value;document.documentElement.lang=value;let t=tx[value];$('da').classList.toggle('active',value==='da');$('en').classList.toggle('active',value==='en');$('de').classList.toggle('active',value==='de');$('da').setAttribute('aria-pressed',String(value==='da'));$('en').setAttribute('aria-pressed',String(value==='en'));$('de').setAttribute('aria-pressed',String(value==='de'));$('subtitle').textContent=t.subtitle;$('helpLabel').textContent=t.help;$('selectLabel').textContent=t.category;$('prev').textContent=t.prev;$('next').textContent=t.next;$('shuffle').textContent=t.shuffle;$('hTitle').textContent=t.hTitle;$('hText').textContent=t.hText;$('hTip').textContent=t.hTip;$('start').textContent=t.start;$('footer').textContent=t.footer;let s=$('category');s.replaceChildren();for(let c of [{key:'all',da:t.all,en:t.all},...CATS]){let o=document.createElement('option');o.value=c.key;o.textContent=c.key==='all'?t.all:catName(c.key);s.append(o)}s.value=cat;if(index>=0)show(history[index]);else emptyState()}
$('da').onclick=()=>setLanguage('da');$('en').onclick=()=>setLanguage('en');$('de').onclick=()=>setLanguage('de');$('category').onchange=e=>{cat=e.target.value;reset()};$('prev').onclick=previous;$('next').onclick=next;$('shuffle').onclick=reset;$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();$('helpBtn').onclick=()=>{$('help').hidden=false};$('start').onclick=()=>{$('help').hidden=true};$('help').onclick=e=>{if(e.target===$('help'))$('help').hidden=true};document.addEventListener('keydown',e=>{if(!$('help').hidden){if(e.key==='Escape')$('help').hidden=true;return}if(e.target.tagName==='SELECT'||e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();previous()}});
setLanguage('da');
(async()=>{const results=await Promise.all(WORDS.map(async w=>{let image=await findImage(w);return image?{...w,image}:null}));available=results.filter(Boolean);reset()})();
</script></body></html>
