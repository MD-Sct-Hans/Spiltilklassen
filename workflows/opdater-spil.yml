name: Opdater spiloversigt og hjemmeside

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  udgiv:
    environment:
      name: github-pages
      url: ${{ steps.udgiv.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Hent hjemmesiden
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Opdater spillelisten
        run: python scripts/opdater_spil.py
      - name: Opsæt GitHub Pages
        uses: actions/configure-pages@v5
      - name: Pak den opdaterede hjemmeside
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Udgiv hjemmesiden
        id: udgiv
        uses: actions/deploy-pages@v4
